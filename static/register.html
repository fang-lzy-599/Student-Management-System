<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAMS 学校教务管理系统 - 学生注册</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="logo">E</div>
            <h1>学生注册</h1>
            <p>创建你的 EAMS 账号</p>
        </div>
        <div id="msg" class="msg"></div>
        <div class="field"><input type="text" id="username" placeholder="用户名（3-20位）"></div>
        <div class="field"><input type="password" id="password" placeholder="密码（6-20位）"></div>
        <div class="field"><input type="text" id="name" placeholder="真实姓名"></div>
        <div class="field">
            <select id="gender">
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="field"><input type="number" id="age" placeholder="年龄" min="10" max="100"></div>
        <button class="btn" onclick="register()">注 册</button>
        <div class="tip">已有账号？<a href="/static/login.html">去登录</a></div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/register.js"></script>
</body>
</html>
